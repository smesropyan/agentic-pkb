[project]
name = "agentic-pkb"
version = "0.1.0"
description = "Personal Knowledge Base — an agent-mediated, structured knowledge repository"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "deepagents>=0.7.5",
    # Imported directly by `pkb.agents.models`: the ollama client lets `httpx.ConnectError` escape
    # on its streaming path, so the failover predicate has to name httpx's exception types.
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "ruamel-yaml>=0.18",
    "sse-starlette>=3.4.8",
    "uvicorn>=0.52.1",
    "wcmatch>=11.0",
]

[project.optional-dependencies]
# Layer 2+ deps land here as those layers are built (deepagents, langgraph, fastapi, textual).

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits a real model provider; requires an API key (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "N", "C4", "TID"]
ignore = ["E501"]  # line-length is enforced by the formatter

[tool.ruff.lint.isort]
known-first-party = ["pkb"]

[tool.mypy]
python_version = "3.12"
packages = ["pkb"]
mypy_path = "src"
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/pkb"]
branch = true

# --- Layer invariants (architecture doc §3, I1/I2). Enforced, not conventional. ---
# Layers not yet built are marked optional (`?`); the contracts start enforcing them the moment
# the package appears, so no edit is needed as the build order advances.
[tool.importlinter]
root_packages = ["pkb"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CX-1 — pkb.core is plain Python: no harness, no network"
type = "forbidden"
source_modules = ["pkb.core"]
# `urllib` is deliberately absent: `urllib.parse` is pure string work and import-linter cannot
# forbid a subpackage of an external/stdlib package. Forbid the clients that reach the network.
forbidden_modules = [
    "deepagents",
    "langgraph",
    "langchain",
    "langchain_core",
    "anthropic",
    "httpx",
    "requests",
    "aiohttp",
    "socket",
]

[[tool.importlinter.contracts]]
name = "I1/I2 layering — core < agents < service < server|tui"
type = "layers"
layers = [
    "(pkb.server) | (pkb.tui)",
    "(pkb.service)",
    "(pkb.agents)",
    "pkb.contracts",
    "pkb.core",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "I2 — transports never import the harness"
type = "forbidden"
source_modules = ["pkb.contracts"]
forbidden_modules = ["deepagents", "langgraph", "langchain", "langchain_core", "pkb.agents"]
