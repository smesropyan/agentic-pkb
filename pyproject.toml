[project]
name = "agentic-pkb"
version = "0.1.0"
description = "Personal Knowledge Base — an agent-mediated, structured knowledge repository"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.22.1",
    "deepagents>=0.7.5",
    # Imported directly by `pkb.agents.models`: the ollama client lets `httpx.ConnectError` escape
    # on its streaming path, so the failover predicate has to name httpx's exception types.
    "fastapi>=0.141.1",
    "httpx>=0.28",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "pypdf>=6.15.0",
    "ruamel-yaml>=0.18",
    "sse-starlette>=3.4.8",
    "textual>=1.0",
    "trafilatura>=2.2.0",
    "uvicorn>=0.52.1",
    "wcmatch>=11.0",
]

[project.optional-dependencies]
# Layer 2+ deps land here as those layers are built (deepagents, langgraph, fastapi, textual).

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not live"` is what makes the marker's own promise true. Without it the help text below was
# aspirational: the only thing keeping a plain `make test` off the network was a skipif on the
# credential variables, so a developer who exported them started making real API calls on every run.
# `pytest -m live` still selects them, because a command-line -m overrides the one in addopts.
addopts = "-q --strict-markers -m 'not live'"
markers = [
    "live: reaches a real provider over the network; needs credentials (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "N", "C4", "TID"]
ignore = ["E501"]  # line-length is enforced by the formatter

[tool.ruff.lint.isort]
known-first-party = ["pkb"]

[tool.mypy]
python_version = "3.12"
packages = ["pkb"]
mypy_path = "src"
strict = true
warn_unreachable = true

[tool.coverage.run]
source = ["src/pkb"]
branch = true

# --- Layer invariants (architecture doc §3, I1/I2). Enforced, not conventional. ---
# Layers not yet built are marked optional (`?`); the contracts start enforcing them the moment
# the package appears, so no edit is needed as the build order advances.
[tool.importlinter]
root_packages = ["pkb"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CX-1 — pkb.core is plain Python: no harness, no network"
type = "forbidden"
source_modules = ["pkb.core"]
# `urllib` is deliberately absent: `urllib.parse` is pure string work and import-linter cannot
# forbid a subpackage of an external/stdlib package. Forbid the clients that reach the network.
forbidden_modules = [
    "deepagents",
    "langgraph",
    "langchain",
    "langchain_core",
    "anthropic",
    "httpx",
    "requests",
    "aiohttp",
    "socket",
]

[[tool.importlinter.contracts]]
name = "I1/I2 layering — core < packs < agents < service < server|tui|clients"
type = "layers"
layers = [
    "(pkb.server) | (pkb.tui)",
    # `pkb.clients` gets its OWN layer rather than sharing one with the transports. The `|` form is
    # import-linter's *independent* delimiter, so siblings may not import each other — and it would
    # forbid the one import `pkb.clients` exists for (arch §6: the approval helper "is imported by
    # the TUI and the Telegram adapter"). Verified BROKEN on both `pkb.tui -> pkb.clients` and
    # `pkb.server -> pkb.clients` before this was corrected. Sitting below `pkb.agents` also makes
    # "the approval helper never touches the harness" a layers fact, and catches
    # `pkb.clients -> pkb.tui` for free.
    "(pkb.clients)",
    "(pkb.service)",
    "(pkb.agents)",
    "(pkb.packs)",
    "pkb.contracts",
    "pkb.core",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "I2 — transports never import the harness, directly or transitively"
type = "forbidden"
# STRICT: indirect imports ARE checked. This is the contract that catches
# `pkb.server.app -> pkb.agents.runtime -> langgraph`; `allow_indirect_imports` here would keep it
# green while deleting exactly the check that matters (decision B, P-8).
source_modules = ["pkb.contracts", "pkb.packs", "pkb.server", "pkb.tui", "pkb.clients"]
forbidden_modules = ["deepagents", "langgraph", "langchain", "langchain_core", "pkb.agents"]

[[tool.importlinter.contracts]]
name = "I2 — the composition root names no harness module"
type = "forbidden"
# DIRECT-ONLY: `pkb.service` is the composition root — something must construct `PkbRuntime` — so a
# transitive chain exists wherever that lives. What it may not do is *name* a harness module: it
# reaches the harness through `pkb.agents`' two exported names and nothing else (SV-2, decision C).
source_modules = ["pkb.service"]
forbidden_modules = ["deepagents", "langgraph", "langchain", "langchain_core"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "I2 — the shared client layer is transport-free and UI-free"
type = "forbidden"
# Step 5's Telegram adapter lives INSIDE the daemon and calls PkbService directly, with no HTTP
# round trip (D9) — MC-7's built test asserts it pulls no HTTP client. If any module under
# `pkb.clients` imported one, that assertion would degrade from a structural fact into a discipline
# about which submodule you happen to import. The httpx2 wrapper lives in `pkb.tui.client`.
source_modules    = ["pkb.clients"]
forbidden_modules = ["httpx", "httpx2", "textual", "fastapi", "starlette", "uvicorn"]
